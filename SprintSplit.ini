; ============================================================
; SprintSplit - 冲刺 / 翻滚 / 后跃 拆分
; 放在 <游戏目录>\SprintSplit\SprintSplit.ini
; 修改后重启游戏生效。
; ============================================================

[General]
; 总开关。改成 false 就完全退化成原版行为（方便对比）。
Enabled=true

; 只对哪个手柄生效：-1 = 所有手柄，0..3 = 指定序号（一般 0 就是你的手柄）。
UserIndex=-1

; 是否写日志 <游戏目录>\SprintSplit\SprintSplit.log。排查问题时有它就够了。
Log=true


[Bindings]
; 冲刺键（按住不放 + 推左摇杆 = 冲刺）。
; 可选值：A B X Y LB RB L3 R3 UP DOWN LEFT RIGHT START BACK GUIDE
; 也可以用加号组合，例如 LB+RB。
; 默认 L3（左摇杆按下），因为它和「蹲下」共用，站立时按仍然会蹲，移动中按只冲刺。
SprintButton=L3

; 左摇杆推到多远才算「在移动」，0.05 ~ 0.95。默认 0.25，适合大多数手柄。
Deadzone=0.25


[Timing]
; 下面几个都是毫秒，按 60 帧算 1 帧 ≈ 16.7ms。
; 游戏是在「B 松开」的那一刻才判定翻滚，所以这几个值决定了你的翻滚反应速度。

; 按下 B 后，游戏看到的「点按」时长。也就是按下到翻滚之间的固定延迟。
;   30 = 2 帧（约 33ms，默认，推荐）
;   16 = 1 帧（最跟手，≈Steam 的 Start Press，但低帧率时可能丢输入）
;   50 = 3 帧（最稳，手感稍慢）
TapMs=30

; 正在冲刺时按 B：先松开 B 这么久，让游戏识别到「松开」，再发出点按。
PreGapMs=30

; 翻滚点按结束后，再松开这么久，然后才恢复冲刺的「按住」。
PostGapMs=30

; 松开摇杆后，冲刺还保持多久（防止抖动误判成松手）。
SprintReleaseMs=150


[Behavior]
; 冲刺中按 B 翻滚后，如果冲刺键还按着，是否自动恢复冲刺。
; false = 必须松开冲刺键再按一次才会重新冲刺。
ResumeSprintAfterRoll=true

; 是否把冲刺键本身从游戏输入里屏蔽掉。
; true  = 移动中按 L3 不会触发蹲下，只当冲刺键用（推荐）
; false = 冲刺键仍然会传给游戏（L3 会同时触发蹲下）
SuppressSprintButton=true
